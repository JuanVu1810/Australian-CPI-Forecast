{#- A "Contact" dropdown for the article header, next to the repository buttons and the
    light/dark switch. Same markup as the theme's own dropdowns (for example Download). -#}
<div class="article-header-buttons">
  <div class="dropdown dropdown-contact-buttons">
    <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Contact">
      <i class="fas fa-address-card"></i>
    </button>
    <ul class="dropdown-menu">
      <li>
        <a href="mailto:vducviethoang@gmail.com" class="btn btn-sm dropdown-item" title="Email me" data-bs-placement="left" data-bs-toggle="tooltip">
          <span class="btn__icon-container"><i class="fas fa-envelope"></i></span>
          <span class="btn__text-container">Email</span>
        </a>
      </li>
      <li>
        <a href="https://www.linkedin.com/in/duc-viet-hoang-vu" target="_blank" rel="noopener" class="btn btn-sm dropdown-item" title="Find me on LinkedIn" data-bs-placement="left" data-bs-toggle="tooltip">
          <span class="btn__icon-container"><i class="fab fa-linkedin"></i></span>
          <span class="btn__text-container">LinkedIn</span>
        </a>
      </li>
    </ul>
  </div>
</div>
