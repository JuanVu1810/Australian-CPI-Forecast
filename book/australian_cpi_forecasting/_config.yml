#######################################################################################
# A default configuration that will be loaded for all jupyter books
# See the documentation for help and more options:
# https://jupyterbook.org/customize/config.html

#######################################################################################
# Book settings
title                       : Australian CPI Forecasting  # The title of the book. Will be placed in the left navbar.
author                      : Juan Vu  # The author of the book
copyright                   : "2026"  # Copyright year to be placed in the footer

# Outputs in every chapter notebook are pre-executed and pinned to
# svar.FORECAST_ORIGIN_PIN, matching the rest of this project's reports/ outputs.
# Do not switch this to 'auto'/'force' without also registering the cpi_forecast
# conda kernel -- the system Python (3.8) cannot import src/models.
execute:
  execute_notebooks: 'off'

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/JuanVu1810/CPI-Forecast  # Online location of your book
  path_to_book: book/australian_cpi_forecasting  # Optional path to your book, relative to the repository root
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true

# Long display equations (see 4.7's PD_stressed/ECL formulas) can overflow the
# content column on narrow viewports; custom.css makes them scroll instead of
# silently clipping.
sphinx:
  config:
    html_theme_options:
      # PyData 0.17 adds a search navbar with a second primary-toggle button.
      # Both themes attach handlers to only the first button, leaving the
      # book's article-header toggle unresponsive. Keep search in the sidebar
      # and use the book theme's single toggle (pydata-sphinx-theme#2451).
      navbar_persistent: []
      # List the intro page (its title, "Welcome to Australian CPI Forecasting") as the first
      # sidebar entry. It has to be set here because this block replaces Jupyter Book's own
      # html_theme_options, so the html.home_page_in_navbar shortcut never reaches the theme.
      home_page_in_toc: true
      # The GitHub buttons in the page header. Set here for the same reason: the html.use_*_button
      # and repository: settings above never reach the theme once this block exists.
      repository_url: https://github.com/JuanVu1810/CPI-Forecast
      repository_branch: main
      path_to_docs: book/australian_cpi_forecasting
      use_repository_button: true
      use_issues_button: true
    html_css_files:
      - custom.css
