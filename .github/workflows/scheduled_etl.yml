name: scheduled-etl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 1 * *"

jobs:
  scheduled-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download source data
        run: python data_retrieval.py 1995 2025 --output-dir dataset
      - name: Build curated dataset
        run: python -m src.build_curated_dataset
      - name: Run tests
        run: python -m pytest tests
