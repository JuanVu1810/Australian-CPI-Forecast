name: scheduled-etl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 1 * *"

jobs:
  scheduled-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt
      - name: Download source data
        run: python data_retrieval.py 1995 "$(date +%Y)" --output-dir dataset
      - name: Build curated dataset
        run: python -m src.build_curated_dataset --load-postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Revised source data legitimately changes this report; tests.yml still enforces it on every push.
      - name: Run tests
        run: python -m pytest tests --deselect tests/test_svar_unemployment_export.py::test_export_reproduces_the_checked_in_report_byte_for_byte
      - name: Check the checked-in SVAR report against the refreshed data (informational)
        continue-on-error: true
        run: python -m pytest tests/test_svar_unemployment_export.py::test_export_reproduces_the_checked_in_report_byte_for_byte
