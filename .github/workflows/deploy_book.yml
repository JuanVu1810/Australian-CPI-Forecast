name: deploy-book

on:
  push:
    branches: [main]
    paths:
      - "book/australian_cpi_forecasting/**"
      - ".github/workflows/deploy_book.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r book/requirements.txt
      - name: Build Jupyter Book
        run: jupyter-book build book/australian_cpi_forecasting
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book/australian_cpi_forecasting/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
